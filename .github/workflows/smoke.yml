name: Smoke7 (reusable)
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan deps
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: library
  job2:
    runs-on: ubuntu-latest
    needs: trivy-fs
    steps:
      - run: echo "JOB2 OK — ${{ inputs.image_name }}"
