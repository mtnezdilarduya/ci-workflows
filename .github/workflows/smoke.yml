name: Smoke10 (reusable)
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "JOB1 — ${{ inputs.image_name }}"
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - run: echo "JOB2 — después de job1"
