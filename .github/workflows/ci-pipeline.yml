# ci-pipeline.yml — Workflow reutilizable de CI/CD (workflow_call).
#
# ⚠️ RESTRICCIÓN CRÍTICA (descubierta 2026-08-21): en cuentas personales de
# GitHub, un workflow reutilizable invocado desde OTRO repo NO puede usar
# `uses:` de acciones (ni actions/checkout ni terceros) — GitHub falla con
# `startup_failure` silencioso. Solo funcionan los `run:` (shell directo).
# Por eso ESTE workflow usa 100% `run:` + CLI (git, curl, docker, trivy…),
# NUNCA `uses:` de acciones.
#
# Uso: cualquier repo del usuario lo invoca con:
#   uses: mtnezdilarduya/ci-workflows/.github/workflows/ci-pipeline.yml@v1
#
# CUBRE LA CADENA COMÚN (build → trivy → semgrep → preview/DAST):
#   - trivy-fs      : escaneo de dependencias (gate CRITICAL/HIGH) — CLI directo
#   - semgrep       : análisis estático (SAST + SARIF) — pip + CLI
#   - docker-build  : build + push a DockerHub (latest + sha) — docker CLI
#   - trivy-image   : escaneo de la imagen publicada — CLI directo
#   - preview       : preview efímero en el runner self-hosted del homelab
#                     (healthcheck → k6 → E2E → ZAP → destruye) con lock
#                     (flock) para que 2 proyectos no se pisen.
#
# NO cubre el job `test` (H1 de la auditoría Claude 2026-08-21): cada repo
# tiene SU propio test. El caller lo define; este workflow solo orquesta la
# parte homogénea. Secrets del REPO QUE LLAMA (mapeo explícito, no inherit).
#
# Seguridad (H5): guard `if: github.ref == 'refs/heads/main'` en preview.
# Concurrencia (H4): recursos del preview parametrizados por ${repo}-${sha}.

name: CI Pipeline (reusable)

on:
  workflow_call:
    inputs:
      # ── Identidad / build ───────────────────────────────────────────────
      image_name:
        description: "Nombre completo de la imagen Docker (ej. mtnezdilarduya/finpowerr)"
        required: true
        type: string
      context:
        description: "Contexto del Dockerfile (ej. backend, .)"
        required: false
        default: "."
        type: string
      dockerfile:
        description: "Ruta al Dockerfile (relativa al contexto)"
        required: false
        default: "Dockerfile"
        type: string
      runner_label:
        description: "Label del runner self-hosted para el preview"
        required: false
        default: "homelab-preview"
        type: string

      # ── Preview efímero ────────────────────────────────────────────────
      preview_port_range:
        description: "Base del rango de puertos por repo (puerto = base + sha%100)"
        required: false
        default: "3100"
        type: string
      preview_internal_port:
        description: "Puerto interno del contenedor (el que EXPONE la app)"
        required: false
        default: "3000"
        type: string
      healthcheck_script:
        description: "Ruta al script de healthcheck del repo (si vacío, solo curl /)"
        required: false
        default: ""
        type: string
      e2e_script:
        description: "Ruta al Dockerfile E2E del repo (si vacío, se omite E2E)"
        required: false
        default: ""
        type: string
      zap_enabled:
        description: "Correr OWASP ZAP baseline (DAST) sobre el preview"
        required: false
        default: true
        type: boolean
      k6_enabled:
        description: "Correr k6 (carga/rendimiento) sobre el preview"
        required: false
        default: true
        type: boolean

      # ── Gates / umbrales ───────────────────────────────────────────────
      trivy_severity:
        description: "Severidad mínima del gate trivy (fs e image)"
        required: false
        default: "CRITICAL,HIGH"
        type: string
      zap_fail_threshold:
        description: "Exit code de ZAP que falla el job (0=info,1=Low/Med,2=High)"
        required: false
        default: "2"
        type: string
      gh_token:
        description: "Token del repo llamante (github.token) para el checkout. El caller DEBE pasarlo (github.token no se propaga a reusables)."
        required: false
        default: ""
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

concurrency:
  group: ci-reusable-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # SCA — dependencias (Trivy CLI directo, sin action)
  # ─────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: Trivy (deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (clone con token del caller)
        run: |
          # El caller pasa github.token como input gh_token (no se propaga solo).
          # Clonar el repo del caller con ese token.
          git config --global url."https://x-access-token:${{ inputs.gh_token }}@github.com/".insteadOf "https://github.com/"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}" 2>/dev/null || true
          echo "repo clonado: $(ls | head -3)"

      - name: Install Trivy CLI
        run: |
          curl -fsSL -o /tmp/trivy.deb \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.deb
          sudo dpkg -i /tmp/trivy.deb
          trivy --version

      - name: Scan dependencies (fs)
        working-directory: .
        run: |
          mkdir -p /tmp/trivy-cache-${{ github.run_id }}
          trivy fs \
            --severity ${{ inputs.trivy_severity }} \
            --ignore-unfixed \
            --vuln-type library \
            --no-progress \
            --cache-dir /tmp/trivy-cache-${{ github.run_id }} \
            --exit-code 1 \
            ${{ inputs.context }} || { echo "GATE trivy-fs: se encontraron vulnerabilidades ${{ inputs.trivy_severity }}" >&2; exit 1; }
          echo "trivy-fs OK (sin vulnerabilidades ${{ inputs.trivy_severity }})"

      - name: Generar SARIF trivy-fs (siempre)
        if: always()
        working-directory: .
        run: |
          trivy fs \
            --severity ${{ inputs.trivy_severity }} \
            --ignore-unfixed \
            --vuln-type library \
            --no-progress \
            --cache-dir /tmp/trivy-cache-${{ github.run_id }} \
            --format sarif \
            --output trivy-fs.sarif \
            ${{ inputs.context }} || true
          echo "SARIF generado: $(ls -la trivy-fs.sarif 2>/dev/null | awk '{print $5}') bytes"

  # ─────────────────────────────────────────────────────────────────────
  # SAST — semgrep (pip + CLI directo)
  # ─────────────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    needs: trivy-fs
    steps:
      - name: Checkout (clone con token del caller)
        run: |
          git config --global url."https://x-access-token:${{ inputs.gh_token }}@github.com/".insteadOf "https://github.com/"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}" 2>/dev/null || true
          echo "repo clonado"

      - name: Semgrep scan (CLI + SARIF)
        working-directory: .
        run: |
          pip install semgrep
          semgrep scan --config p/security-audit --config p/python --config p/javascript \
            --sarif --sarif-output semgrep.sarif \
            --error --severity ERROR . || true
          ls -la semgrep.sarif 2>/dev/null || echo "semgrep.sarif no generado"

      - name: Guardar SARIF semgrep
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/artifacts
          cp semgrep.sarif /tmp/artifacts/ 2>/dev/null || true
          echo "semgrep SARIF listo en /tmp/artifacts"

  # ─────────────────────────────────────────────────────────────────────
  # Build + push a DockerHub + Scout (docker CLI)
  # ─────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build + push + Scout
    runs-on: ubuntu-latest
    needs: [trivy-fs, semgrep]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout (clone con token del caller)
        run: |
          git config --global url."https://x-access-token:${{ inputs.gh_token }}@github.com/".insteadOf "https://github.com/"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}" 2>/dev/null || true
          echo "repo clonado"

      - name: Docker meta (tags)
        id: meta
        run: |
          echo "tags=${{ inputs.image_name }}:latest,${{ inputs.image_name }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login DockerHub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build image
        working-directory: .
        run: |
          docker build \
            -f ${{ inputs.dockerfile }} \
            -t ${{ inputs.image_name }}:latest \
            -t ${{ inputs.image_name }}:sha-${GITHUB_SHA::7} \
            ${{ inputs.context }}

      - name: Push a DockerHub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          docker push ${{ inputs.image_name }}:latest
          docker push ${{ inputs.image_name }}:sha-${GITHUB_SHA::7}
          echo "Pushed: ${{ inputs.image_name }}:latest + :sha-${GITHUB_SHA::7}"

      - name: Docker Scout (vuln analysis)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          docker scout cves ${{ inputs.image_name }}:latest \
            --only-severity critical,high \
            --format sarif --output scout-report.sarif || true
          echo "Scout SARIF: $(ls -la scout-report.sarif 2>/dev/null | awk '{print $5}') bytes"

  # ─────────────────────────────────────────────────────────────────────
  # Trivy imagen publicada (CLI directo)
  # ─────────────────────────────────────────────────────────────────────
  trivy-image:
    name: Trivy (image)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Install Trivy CLI
        run: |
          curl -fsSL -o /tmp/trivy.deb \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.deb
          sudo dpkg -i /tmp/trivy.deb
          trivy --version

      - name: Scan image publicada
        run: |
          docker pull ${{ inputs.image_name }}:sha-${GITHUB_SHA::7}
          mkdir -p /tmp/trivy-cache-${{ github.run_id }}
          trivy image \
            --severity ${{ inputs.trivy_severity }} \
            --ignore-unfixed \
            --vuln-type os,library \
            --no-progress \
            --cache-dir /tmp/trivy-cache-${{ github.run_id }} \
            --exit-code 1 \
            ${{ inputs.image_name }}:sha-${GITHUB_SHA::7} || { echo "GATE trivy-image: vulnerabilidades ${{ inputs.trivy_severity }}" >&2; exit 1; }
          echo "trivy-image OK"

      - name: Generar SARIF trivy-image (siempre)
        if: always()
        run: |
          trivy image \
            --severity ${{ inputs.trivy_severity }} \
            --ignore-unfixed \
            --vuln-type os,library \
            --no-progress \
            --cache-dir /tmp/trivy-cache-${{ github.run_id }} \
            --format sarif \
            --output trivy-image.sarif \
            ${{ inputs.image_name }}:sha-${GITHUB_SHA::7} || true
          echo "SARIF: $(ls -la trivy-image.sarif 2>/dev/null | awk '{print $5}') bytes"

  # ─────────────────────────────────────────────────────────────────────
  # Preview efímero + DAST (runner self-hosted del homelab)
  # ─────────────────────────────────────────────────────────────────────
  preview:
    name: Preview efímero + DAST
    runs-on: ${{ inputs.runner_label }}
    # Cadena explícita: el DAST NUNCA corre sobre una imagen no verificada.
    needs: [docker-build, trivy-image]
    # Guard de seguridad (H5): solo main — un PR de fork jamás toca el homelab.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout (clone con token del caller)
        run: |
          git config --global url."https://x-access-token:${{ inputs.gh_token }}@github.com/".insteadOf "https://github.com/"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "${GITHUB_SHA}" 2>/dev/null || true
          echo "repo clonado"

      - name: Parametrizar recursos del preview (H4)
        id: res
        run: |
          REPO_SHORT="${GITHUB_REPOSITORY##*/}"
          SHA_NUM=$((16#$GITHUB_SHA))
          PORT=$(( 10#${{ inputs.preview_port_range }} + (SHA_NUM % 100) ))
          NET="${REPO_SHORT}-e2e-net-${GITHUB_SHA::7}"
          CONT="${REPO_SHORT}-preview-${GITHUB_SHA::7}"
          E2E_IMG="${REPO_SHORT}-e2e:${GITHUB_SHA::7}"
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"
          echo "net=${NET}" >> "$GITHUB_OUTPUT"
          echo "cont=${CONT}" >> "$GITHUB_OUTPUT"
          echo "e2e_img=${E2E_IMG}" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_PORT=${PORT}" >> "$GITHUB_ENV"
          echo "PREVIEW_NET=${NET}" >> "$GITHUB_ENV"
          echo "PREVIEW_CONT=${CONT}" >> "$GITHUB_ENV"
          echo "E2E_IMG=${E2E_IMG}" >> "$GITHUB_ENV"
          echo "Recursos: port=${PORT} net=${NET} cont=${CONT}"

      - name: Lock de preview (cola entre repos)
        run: |
          exec 9>/tmp/ci-preview.lock
          flock -w 900 9 || { echo "ERROR: timeout esperando el preview de otro repo" >&2; exit 1; }
          echo "Lock adquirido — preview de ${GITHUB_REPOSITORY}"

      - name: Prune de imágenes viejas (H6)
        run: |
          docker image prune -f --filter "until=24h" 2>/dev/null || true
          docker system prune -f --filter "until=24h" 2>/dev/null || true

      - name: Levantar preview efímero
        run: |
          set -e
          PREVIEW_IMAGE=${{ inputs.image_name }}:sha-${GITHUB_SHA::7}
          docker network create ${PREVIEW_NET} 2>/dev/null || true
          docker rm -f ${PREVIEW_CONT} 2>/dev/null || true
          docker run -d --name ${PREVIEW_CONT} \
            --network ${PREVIEW_NET} \
            -p ${PREVIEW_PORT}:${{ inputs.preview_internal_port }} \
            -e DATABASE_PATH=/tmp/preview.db \
            -e JWT_SECRET=preview-secret-${GITHUB_SHA} \
            ${PREVIEW_IMAGE}
          echo "Preview up en :${PREVIEW_PORT} (red ${PREVIEW_NET})"
          sleep 5

      - name: Healthcheck del preview
        run: |
          set -e
          URL="http://127.0.0.1:${PREVIEW_PORT}"
          curl -sf -o /dev/null -w "GET / -> %{http_code}\n" "$URL/"
          if [ -n "${{ inputs.healthcheck_script }}" ] && [ -f "${{ inputs.healthcheck_script }}" ]; then
            echo "Healthcheck específico del repo..."
            bash "${{ inputs.healthcheck_script }}" "$URL"
          fi
          echo "HEALTHCHECK OK"

      - name: Test NO funcional (k6)
        if: ${{ inputs.k6_enabled }}
        run: |
          set -e
          docker run --rm \
            --network ${PREVIEW_NET} \
            -v ${GITHUB_WORKSPACE}/backend/scripts:/scripts \
            -e PREVIEW_URL="http://${PREVIEW_CONT}:${{ inputs.preview_internal_port }}" \
            grafana/k6 run --summary-export /scripts/k6-summary.json \
            /scripts/load_test.js || echo "k6 con fallos (no gate en esta fase)"
          echo "K6 ejecutado"

      - name: Robustez post-carga
        run: |
          set -e
          URL="http://127.0.0.1:${PREVIEW_PORT}"
          curl -sf -o /dev/null -w "healthcheck post-carga -> %{http_code}\n" "$URL/"
          docker inspect -f '{{.State.Running}}' ${PREVIEW_CONT} | grep -q true \
            && echo "contenedor preview sigue vivo" \
            || { echo "ERROR: el preview murió bajo carga" >&2; exit 1; }

      - name: E2E frontend (Puppeteer)
        if: ${{ inputs.e2e_script != '' }}
        run: |
          set -e
          E2E_DIR="$(dirname ${{ inputs.e2e_script }})"
          docker build -f "${{ inputs.e2e_script }}" \
            -t ${E2E_IMG} "${E2E_DIR}"
          docker run --rm \
            --network ${PREVIEW_NET} \
            -e PREVIEW_URL="http://${PREVIEW_CONT}:${{ inputs.preview_internal_port }}" \
            ${E2E_IMG}
          echo "E2E OK"

      - name: OWASP ZAP baseline (DAST) — gate High
        if: ${{ inputs.zap_enabled }}
        run: |
          set -e
          ZAP_TARGET="http://${PREVIEW_CONT}:${{ inputs.preview_internal_port }}"
          mkdir -p ${GITHUB_WORKSPACE}/zap-out
          ZAP_EXIT=0
          docker run --rm -t \
            -v ${GITHUB_WORKSPACE}/.zap/rules.tsv:/zap/rules.tsv \
            -v ${GITHUB_WORKSPACE}/zap-out:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${ZAP_TARGET}" \
            -c /zap/rules.tsv \
            -J /zap/wrk/zap_report.json \
            -r /zap/wrk/zap_report.html || ZAP_EXIT=$?
          echo "ZAP exit code: ${ZAP_EXIT}"
          if [ ! -s ${GITHUB_WORKSPACE}/zap-out/zap_report.json ]; then
            echo "ERROR: ZAP no generó reporte" >&2; exit 1
          fi
          if [ "${ZAP_EXIT}" -ge ${{ inputs.zap_fail_threshold }} ]; then
            echo "ZAP encontró alertas ≥ threshold — gate falla" >&2
            exit ${ZAP_EXIT}
          fi
          echo "ZAP OK (sin alertas por encima del threshold)"

      - name: Destruir preview (siempre)
        if: always()
        run: |
          docker rm -f ${PREVIEW_CONT} 2>/dev/null || true
          docker network rm ${PREVIEW_NET} 2>/dev/null || true
          echo "Preview destruido"
