name: Smoke3 (reusable)
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      zap_enabled:
        required: false
        default: true
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false

concurrency:
  group: ci-reusable-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - run: echo "SMOKE OK — imagen ${{ inputs.image_name }}"
      - if: ${{ inputs.zap_enabled }}
        run: echo "ZAP enabled"
