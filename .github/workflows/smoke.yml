name: Smoke4 (reusable)
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      runner_label:
        required: false
        default: homelab-preview
        type: string

jobs:
  smoke:
    runs-on: ${{ inputs.runner_label }}
    steps:
      - run: echo "SMOKE OK — imagen ${{ inputs.image_name }} en ${{ inputs.runner_label }}"
