name: Smoke9 (reusable)
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy CLI
        run: |
          curl -fsSL -o /tmp/trivy.deb \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.deb
          sudo dpkg -i /tmp/trivy.deb
      - name: Scan deps
        run: trivy fs --severity CRITICAL --ignore-unfixed --vuln-type library --exit-code 1 .
  job2:
    runs-on: ubuntu-latest
    needs: trivy-fs
    steps:
      - run: echo "JOB2 OK — ${{ inputs.image_name }}"
